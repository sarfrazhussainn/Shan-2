<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 84" fill="none" role="img" aria-label="Shan Testing and Trading Company">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E3A9"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#E2BA49"/>
    </linearGradient>
    <linearGradient id="goldLightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F5E3A9"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <!-- Dark Navy Shield Background -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#040D1A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- BRAND EMBLEM -->
  <g transform="translate(4, 2)" filter="url(#glow)">
    <!-- Outer Precision Hexagon / Shield -->
    <polygon points="40,2 74,21.5 74,60.5 40,80 6,60.5 6,21.5" 
             fill="url(#shieldGrad)" 
             stroke="url(#goldGrad)" 
             stroke-width="2.5" 
             stroke-linejoin="round" />

    <!-- Inner Technical Calibration Grid Lines (Subtle) -->
    <polygon points="40,9 68,25 68,57 40,73 12,57 12,25" 
             fill="none" 
             stroke="#1E3E62" 
             stroke-width="1" 
             opacity="0.6" />

    <!-- Geometric Monogram "S" (Crafted from interlocking precision calipers & testing arcs) -->
    <!-- Top Arc of 'S' -->
    <path d="M 54 27 C 54 21 48 18 40 18 C 30 18 24 23 24 30 C 24 38 31 41 40 43 C 49 45 56 48 56 56 C 56 64 49 69 39 69 C 29 69 23 64 23 58" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Center Precision Diamond (Testing Calibration Spark) -->
    <polygon points="40,38 45,43 40,48 35,43" 
             fill="#FFFFFF" 
             opacity="0.95" />

    <!-- Technical Compass / Caliper Nodes -->
    <circle cx="54" cy="27" r="3" fill="url(#goldGrad)"/>
    <circle cx="23" cy="58" r="3" fill="url(#goldGrad)"/>
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(94, 0)">
    <!-- Primary Brand Wordmark: SHAN -->
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="34" 
          letter-spacing="2.5" 
          fill="currentColor" 
          class="brand-title">
      SHAN
    </text>

    <!-- Luxury Gold Accent Separator Bar with Diamond Dot -->
    <line x1="126" y1="33" x2="330" y2="33" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>
    <polygon points="126,33 130,30 134,33 130,36" fill="url(#goldGrad)"/>

    <!-- Secondary Descriptor: TESTING & TRADING COMPANY -->
    <text x="0" y="65" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-weight="700" 
          font-size="11.5" 
          letter-spacing="3.8" 
          fill="url(#goldLightGrad)">
      TESTING &amp; TRADING COMPANY
    </text>
  </g>
</svg>
