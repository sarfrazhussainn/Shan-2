<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" fill="none" role="img" aria-label="Shan Logo Icon">
  <defs>
    <linearGradient id="goldGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E3A9"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#E2BA49"/>
    </linearGradient>
    <linearGradient id="shieldGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#040D1A"/>
    </linearGradient>
    <filter id="glowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g transform="translate(4, 4)" filter="url(#glowIcon)">
    <!-- Outer Precision Hexagon / Shield -->
    <polygon points="40,2 74,21.5 74,60.5 40,80 6,60.5 6,21.5" 
             fill="url(#shieldGradIcon)" 
             stroke="url(#goldGradIcon)" 
             stroke-width="2.5" 
             stroke-linejoin="round" />

    <!-- Inner Grid -->
    <polygon points="40,9 68,25 68,57 40,73 12,57 12,25" 
             fill="none" 
             stroke="#1E3E62" 
             stroke-width="1" 
             opacity="0.6" />

    <!-- Stylized Precision 'S' Monogram -->
    <path d="M 54 27 C 54 21 48 18 40 18 C 30 18 24 23 24 30 C 24 38 31 41 40 43 C 49 45 56 48 56 56 C 56 64 49 69 39 69 C 29 69 23 64 23 58" 
          fill="none" 
          stroke="url(#goldGradIcon)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Center Precision Diamond -->
    <polygon points="40,38 45,43 40,48 35,43" 
             fill="#FFFFFF" 
             opacity="0.95" />

    <circle cx="54" cy="27" r="3" fill="url(#goldGradIcon)"/>
    <circle cx="23" cy="58" r="3" fill="url(#goldGradIcon)"/>
  </g>
</svg>
